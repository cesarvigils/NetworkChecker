[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "networkchecker"
version = "1.0.0"
description = "Full Network Checker Interface — SSID, ping, packet loss, IP/geolocation, speed test, carrier info, and an optional stability scanner."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "cesarvigils" }]
keywords = ["network", "diagnostics", "ping", "speedtest", "ssid", "wifi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: System :: Networking :: Monitoring",
    "Environment :: Console",
    "Environment :: X11 Applications",
]
dependencies = [
    "requests>=2.31",
    "speedtest-cli>=2.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pyinstaller>=6.3",
]

[project.scripts]
networkchecker = "networkchecker.cli:main"

[project.gui-scripts]
networkchecker-gui = "networkchecker.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
