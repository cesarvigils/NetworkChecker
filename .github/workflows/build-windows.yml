name: Build Windows packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Build GUI exe
        run: pyinstaller --noconfirm --clean packaging/pyinstaller/NetworkChecker.spec

      - name: Build CLI exe
        run: pyinstaller --noconfirm --clean packaging/pyinstaller/NetworkCheckerCLI.spec

      - name: Smoke-test the CLI exe
        run: dist\NetworkChecker-CLI.exe --version

      - name: Upload raw executables
        uses: actions/upload-artifact@v4
        with:
          name: NetworkChecker-exe
          path: |
            dist/NetworkChecker.exe
            dist/NetworkChecker-CLI.exe

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (.exe)
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe" packaging\inno\NetworkChecker.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NetworkChecker-Setup
          path: packaging/inno/Output/NetworkChecker-Setup.exe

      - name: Install WiX Toolset
        run: choco install wixtoolset --no-progress -y

      - name: Build MSI
        run: |
          $env:PATH += ";C:\Program Files (x86)\WiX Toolset v3.11\bin"
          New-Item -ItemType Directory -Force -Path build\wix | Out-Null
          candle -dSourceDir=dist packaging\wix\NetworkChecker.wxs -o build\wix\
          light build\wix\NetworkChecker.wixobj -ext WixUIExtension -o dist\NetworkChecker.msi

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: NetworkChecker-msi
          path: dist/NetworkChecker.msi
